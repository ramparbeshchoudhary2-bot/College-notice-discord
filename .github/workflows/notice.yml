name: College Notice to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-notice:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4

      - name: Check for new college notice
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import requests
          from bs4 import BeautifulSoup
          import os
          import json

          PAGE = "https://www.suryasencollege.org.in/new_2020_GeneralNotice.php"
          STATE = "last_notice.txt"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"]

          html = requests.get(PAGE, timeout=30).text
          soup = BeautifulSoup(html, "html.parser")

          notices = []

          for a in soup.find_all("a", href=True):
              text = a.get_text(" ", strip=True)
              href = a["href"]

              if href.lower().endswith(".pdf"):
                  url = href

                  if url.startswith("/"):
                      url = "https://www.suryasencollege.org.in" + url
                  elif url.startswith("General_Notice"):
                      url = "https://www.suryasencollege.org.in/" + url

                  notices.append((text, url))

          if not notices:
              print("No PDF notices found.")
              raise SystemExit

          title, pdf_url = notices[0]

          print("Newest notice:", title)
          print("PDF:", pdf_url)

          old = ""
          if os.path.exists(STATE):
              old = open(STATE).read().strip()

          if not old:
              open(STATE, "w").write(pdf_url)
              print("Initial notice saved.")
              raise SystemExit

          if pdf_url == old:
              print("No new notice.")
              raise SystemExit

          r = requests.get(pdf_url, timeout=60)
          r.raise_for_status()

          filename = pdf_url.split("/")[-1].split("?")[0]

          if not filename.lower().endswith(".pdf"):
              filename = "college_notice.pdf"

          open(filename, "wb").write(r.content)

          message = {
              "content": "@everyone\n📢 **NEW COLLEGE NOTICE**\n" +
                         title.strip()
          }

          with open(filename, "rb") as f:
              response = requests.post(
                  WEBHOOK,
                  data={"payload_json": json.dumps(message)},
                  files={
                      "files[0]": (
                          filename,
                          f,
                          "application/pdf"
                      )
                  },
                  timeout=60
              )

          response.raise_for_status()

          open(STATE, "w").write(pdf_url)

          print("PDF successfully sent to Discord.")
          PY

      - name: Save notice state
        run: |
          git config user.name "College Notice Bot"
          git config user.email "actions@github.com"
          git add last_notice.txt
          git diff --cached --quiet || git commit -m "Update latest college notice"
          git push
