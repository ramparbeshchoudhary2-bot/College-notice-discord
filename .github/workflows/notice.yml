name: College Notice to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-notice:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install requests beautifulsoup4

      - name: Check for new college notice
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          import os
          import json
          import time
          import re
          import subprocess
          import glob

          PAGE = "https://www.suryasencollege.org.in/new_2020_GeneralNotice.php"
          STATE = "last_notice.txt"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"]

          # ==========================================
          # CONNECT TO COLLEGE WEBSITE
          # ==========================================

          html = None

          for attempt in range(1, 6):
              try:
                  print(f"Connecting to college website: {attempt}/5")

                  response = requests.get(
                      PAGE,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 (College Notice Monitor)"
                      },
                      timeout=60
                  )

                  response.raise_for_status()
                  html = response.text

                  print("Website connected successfully.")
                  break

              except Exception as e:
                  print("Connection error:", e)

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if html is None:
              print("College website could not be reached.")
              raise SystemExit(1)

          # ==========================================
          # FIND NOTICE PDFS
          # ==========================================

          soup = BeautifulSoup(html, "html.parser")
          notices = []

          heading = None

          for tag in soup.find_all(
              ["h1", "h2", "h3", "h4", "h5", "h6"]
          ):
              if "GENERAL NOTICE" in tag.get_text(
                  " ",
                  strip=True
              ).upper():
                  heading = tag
                  break

          if heading:
              print("GENERAL NOTICE section found.")

              for element in heading.find_all_next(
                  "a",
                  href=True
              ):

                  text = element.get_text(
                      " ",
                      strip=True
                  )

                  href = element.get(
                      "href",
                      ""
                  ).strip()

                  if not href:
                      continue

                  if ".pdf" not in href.lower():
                      continue

                  pdf_url = urljoin(PAGE, href)

                  # Notice dates on the website
                  match = re.search(
                      r'(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})',
                      text
                  )

                  if not match:
                      continue

                  date_text = match.group(0)

                  notices.append(
                      (
                          date_text,
                          text,
                          pdf_url
                      )
                  )

                  if len(notices) >= 30:
                      break

          # ==========================================
          # FALLBACK
          # ==========================================

          if not notices:

              print("GENERAL NOTICE section not detected.")
              print("Trying fallback PDF search...")

              for a in soup.find_all(
                  "a",
                  href=True
              ):

                  text = a.get_text(
                      " ",
                      strip=True
                  )

                  href = a.get(
                      "href",
                      ""
                  ).strip()

                  if ".pdf" not in href.lower():
                      continue

                  match = re.search(
                      r'(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})',
                      text
                  )

                  if not match:
                      continue

                  pdf_url = urljoin(PAGE, href)

                  notices.append(
                      (
                          match.group(0),
                          text,
                          pdf_url
                      )
                  )

          if not notices:
              print("No PDF notices found.")
              raise SystemExit(1)

          # ==========================================
          # LATEST NOTICE
          # ==========================================

          date_text, title, pdf_url = notices[0]

          print("")
          print("====================================")
          print("LATEST COLLEGE NOTICE")
          print("Date:", date_text)
          print("Title:", title)
          print("PDF:", pdf_url)
          print("====================================")
          print("")

          # ==========================================
          # CHECK PREVIOUS NOTICE
          # ==========================================

          old = ""

          if os.path.exists(STATE):
              with open(STATE, "r") as f:
                  old = f.read().strip()

          if not old:

              with open(STATE, "w") as f:
                  f.write(pdf_url)

              print("First run completed.")
              print("Current notice saved without sending.")

              raise SystemExit(0)

          if pdf_url == old:

              print("No new notice.")
              raise SystemExit(0)

          print("NEW NOTICE FOUND!")

          # ==========================================
          # DOWNLOAD PDF
          # ==========================================

          pdf_data = None

          for attempt in range(1, 6):

              try:

                  print(
                      f"Downloading PDF: {attempt}/5"
                  )

                  pdf_response = requests.get(
                      pdf_url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 (College Notice Monitor)"
                      },
                      timeout=90
                  )

                  pdf_response.raise_for_status()

                  pdf_data = pdf_response.content

                  print(
                      f"PDF downloaded: "
                      f"{len(pdf_data)} bytes"
                  )

                  break

              except Exception as e:

                  print(
                      "PDF download error:",
                      e
                  )

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if pdf_data is None:
              print("Could not download PDF.")
              raise SystemExit(1)

          # ==========================================
          # SAVE PDF
          # ==========================================

          filename = pdf_url.split("/")[-1]
          filename = filename.split("?")[0]

          if not filename.lower().endswith(".pdf"):
              filename = "college_notice.pdf"

          with open(filename, "wb") as f:
              f.write(pdf_data)

          print("PDF saved:", filename)

          # ==========================================
          # OCR THE SCANNED PDF
          # ==========================================

          notice_number = "Not detected"

          try:

              print("")
              print("Starting OCR...")
              print("Converting PDF pages to images...")

              # Convert first 5 pages to high-resolution PNG
              subprocess.run(
                  [
                      "pdftoppm",
                      "-f",
                      "1",
                      "-l",
                      "5",
                      "-r",
                      "300",
                      "-png",
                      filename,
                      "notice_page"
                  ],
                  check=True
              )

              images = sorted(
                  glob.glob("notice_page-*.png")
              )

              print(
                  "Pages converted:",
                  len(images)
              )

              all_ocr_text = ""

              for image in images:

                  print(
                      "Running OCR on:",
                      image
                  )

                  try:

                      result = subprocess.run(
                          [
                              "tesseract",
                              image,
                              "stdout",
                              "--psm",
                              "6"
                          ],
                          capture_output=True,
                          text=True
                      )

                      text = result.stdout

                      all_ocr_text += "\n" + text

                      print(
                          "OCR result:"
                      )
                     
