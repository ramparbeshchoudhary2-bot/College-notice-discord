name: College Notice to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-notice:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install requests beautifulsoup4

      - name: Check for new college notice
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          import os
          import json
          import time
          import re
          import subprocess
          import glob

          PAGE = "https://www.suryasencollege.org.in/new_2020_GeneralNotice.php"
          STATE = "last_notice.txt"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"]

          # -----------------------------------------
          # CONNECT TO COLLEGE WEBSITE
          # -----------------------------------------

          html = None

          for attempt in range(1, 6):
              try:
                  print(f"Connecting to college website: {attempt}/5")

                  r = requests.get(
                      PAGE,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      },
                      timeout=60
                  )

                  r.raise_for_status()
                  html = r.text

                  print("Website connected successfully.")
                  break

              except Exception as e:
                  print("Connection error:", e)

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if html is None:
              print("Could not connect to college website.")
              raise SystemExit(1)

          # -----------------------------------------
          # FIND PDF NOTICES
          # -----------------------------------------

          soup = BeautifulSoup(html, "html.parser")
          notices = []

          for a in soup.find_all("a", href=True):

              text = a.get_text(" ", strip=True)
              href = a.get("href", "").strip()

              if ".pdf" not in href.lower():
                  continue

              pdf_url = urljoin(PAGE, href)

              date_match = re.search(
                  r'(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})',
                  text
              )

              if not date_match:
                  continue

              date_text = date_match.group(0)

              notices.append(
                  (date_text, text, pdf_url)
              )

          if not notices:
              print("No PDF notices found.")
              raise SystemExit(1)

          # -----------------------------------------
          # COLLEGE PAGE LISTS NEWEST NOTICE FIRST
          # -----------------------------------------

          date_text, title, pdf_url = notices[0]

          print("")
          print("LATEST NOTICE")
          print("Date:", date_text)
          print("Title:", title)
          print("PDF:", pdf_url)
          print("")

          # -----------------------------------------
          # CHECK PREVIOUS NOTICE
          # -----------------------------------------

          old = ""

          if os.path.exists(STATE):
              with open(STATE, "r") as f:
                  old = f.read().strip()

          if old == pdf_url:
              print("No new notice.")
              raise SystemExit(0)

          print("NEW NOTICE FOUND!")

          # -----------------------------------------
          # DOWNLOAD PDF
          # -----------------------------------------

          pdf_data = None

          for attempt in range(1, 6):
              try:
                  print(f"Downloading PDF: {attempt}/5")

                  r = requests.get(
                      pdf_url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      },
                      timeout=90
                  )

                  r.raise_for_status()
                  pdf_data = r.content

                  print(
                      "PDF downloaded:",
                      len(pdf_data),
                      "bytes"
                  )

                  break

              except Exception as e:
                  print("PDF download error:", e)

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if pdf_data is None:
              print("Could not download PDF.")
              raise SystemExit(1)

          filename = pdf_url.split("/")[-1]
          filename = filename.split("?")[0]

          if not filename.lower().endswith(".pdf"):
              filename = "college_notice.pdf"

          with open(filename, "wb") as f:
              f.write(pdf_data)

          print("PDF saved as:", filename)

          # -----------------------------------------
          # OCR
          # -----------------------------------------

          notice_number = "Not detected"

          try:
              print("")
              print("Starting OCR...")

              prefix = "notice_page"

              subprocess.run(
                  [
                      "pdftoppm",
                      "-f", "1",
                      "-l", "5",
                      "-r", "300",
                      "-png",
                      filename,
                      prefix
                  ],
                  check=True
              )

              images = sorted(
                  glob.glob(prefix + "-*.png")
              )

              print(
                  "PDF pages converted:",
                  len(images)
              )

              ocr_text = ""

              for image in images:

                  print(
                      "Running OCR on:",
                      image
                  )

                  result = subprocess.run(
                      [
                          "tesseract",
                          image,
                          "stdout",
                          "--psm",
                          "6"
                      ],
                      capture_output=True,
                      text=True
                  )

                  page_text = result.stdout

                  ocr_text += "\n" + page_text

                  print(
                      "OCR text:",
                      page_text[:1000]
                  )

              # -------------------------------------
              # FIND NOTICE NUMBER
              # -------------------------------------

              patterns = [
                  r'Notice\s*No\.?\s*[:\-]?\s*(\d{1,4})',
                  r'Notice\s*Number\s*[:\-]?\s*(\d{1,4})',
                  r'NOTICE\s*NO\.?\s*[:\-]?\s*(\d{1,4})',
                  r'NO\.?\s*[:\-]\s*(\d{1,4})'
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      ocr_text,
                      re.IGNORECASE
                  )

                  if match:
                      notice_number = match.group(1)
                      break

              print(
                  "Detected Notice Number:",
                  notice_number
              )

              # Delete temporary images

              for image in images:
                  try:
                      os.remove(image)
                  except:
                      pass

          except Exception as e:
              print("OCR error:", e)
              print("Continuing without
