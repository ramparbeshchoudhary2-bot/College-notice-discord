name: College Notice to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-notice:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v5

      - name: Install Python packages
        run: |
          pip install requests beautifulsoup4

      - name: Check for new college notice
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          import os
          import json
          import time
          import re

          PAGE = "https://www.suryasencollege.org.in/new_2020_GeneralNotice.php"
          STATE = "last_notice.txt"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"]

          # -----------------------------
          # GET COLLEGE WEBSITE
          # -----------------------------

          html = None

          for attempt in range(1, 6):
              try:
                  print(f"Connecting to college website: {attempt}/5")

                  response = requests.get(
                      PAGE,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 (College Notice Monitor)"
                      },
                      timeout=60
                  )

                  response.raise_for_status()
                  html = response.text

                  print("Website connected successfully.")
                  break

              except Exception as e:
                  print("Connection error:", e)

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if html is None:
              print("College website could not be reached.")
              raise SystemExit(1)

          # -----------------------------
          # PARSE PAGE
          # -----------------------------

          soup = BeautifulSoup(html, "html.parser")

          notices = []

          # Find the heading "GENERAL NOTICE"
          heading = None

          for tag in soup.find_all(
              ["h1", "h2", "h3", "h4", "h5", "h6"]
          ):
              if "GENERAL NOTICE" in tag.get_text(
                  " ",
                  strip=True
              ).upper():
                  heading = tag
                  break

          if heading:
              print("GENERAL NOTICE section found.")

              # Start from the heading and inspect
              # following links.
              for element in heading.find_all_next("a", href=True):

                  text = element.get_text(
                      " ",
                      strip=True
                  )

                  href = element.get("href", "").strip()

                  if not href:
                      continue

                  # Stop after leaving the notice section
                  if len(notices) >= 100:
                      break

                  # Only accept PDF links
                  if ".pdf" not in href.lower():
                      continue

                  # Only accept links that look like
                  # college General Notice PDFs
                  pdf_url = urljoin(PAGE, href)

                  # Extract date from the link text
                  match = re.search(
                      r'(\d{2})[-/.](\d{2})[-/.](\d{4})',
                      text
                  )

                  if not match:
                      continue

                  date_text = match.group(0)

                  notices.append(
                      (
                          date_text,
                          text,
                          pdf_url
                      )
                  )

                  # The first few links after the
                  # GENERAL NOTICE heading are enough.
                  if len(notices) >= 30:
                      break

          # -----------------------------
          # FALLBACK
          # -----------------------------

          if not notices:
              print(
                  "Could not identify notices from "
                  "GENERAL NOTICE section."
              )

              # Fallback: scan all links
              for a in soup.find_all("a", href=True):

                  text = a.get_text(
                      " ",
                      strip=True
                  )

                  href = a.get("href", "").strip()

                  if ".pdf" not in href.lower():
                      continue

                  match = re.search(
                      r'(\d{2})[-/.](\d{2})[-/.](\d{4})',
                      text
                  )

                  if not match:
                      continue

                  pdf_url = urljoin(PAGE, href)

                  notices.append(
                      (
                          match.group(0),
                          text,
                          pdf_url
                      )
                  )

          if not notices:
              print("No notices found.")
              raise SystemExit(1)

          # -----------------------------
          # THE COLLEGE PAGE IS NEWEST FIRST
          # -----------------------------

          date_text, title, pdf_url = notices[0]

          print("")
          print("===== LATEST COLLEGE NOTICE =====")
          print("Date:", date_text)
          print("Title:", title)
          print("PDF:", pdf_url)
          print("=================================")
          print("")

          # -----------------------------
          # CHECK PREVIOUS NOTICE
          # -----------------------------

          old = ""

          if os.path.exists(STATE):
              with open(STATE, "r") as f:
                  old = f.read().strip()

          # FIRST RUN
          #
          # Save the current latest notice.
          # Do NOT send old notices.

          if not old:

              with open(STATE, "w") as f:
                  f.write(pdf_url)

              print(
                  "First run completed. "
                  "Current notice saved without sending."
              )

              raise SystemExit(0)

          # NO NEW NOTICE

          if pdf_url == old:

              print("No new notice.")
              raise SystemExit(0)

          print("NEW NOTICE FOUND!")

          # -----------------------------
          # DOWNLOAD PDF
          # -----------------------------

          pdf_data = None

          for attempt in range(1, 6):

              try:

                  print(
                      f"Downloading PDF: {attempt}/5"
                  )

                  pdf_response = requests.get(
                      pdf_url,
                      headers={
                          "User-Agent":
                          "Mozilla/5.0 (College Notice Monitor)"
                      },
                      timeout=90
                  )

                  pdf_response.raise_for_status()

                  pdf_data = pdf_response.content

                  print(
                      f"PDF downloaded: "
                      f"{len(pdf_data)} bytes"
                  )

                  break

              except Exception as e:

                  print(
                      "PDF download error:",
                      e
                  )

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if pdf_data is None:
              print("Could not download PDF.")
              raise SystemExit(1)

          # -----------------------------
          # SAVE PDF
          # -----------------------------

          filename = pdf_url.split("/")[-1]
          filename = filename.split("?")[0]

          if not filename.lower().endswith(".pdf"):
              filename = "college_notice.pdf"

          with open(filename, "wb") as f:
              f.write(pdf_data)

          # -----------------------------
          # SEND TO DISCORD
          # -----------------------------

          message = {
              "content":
                  "@everyone\n"
                  "📢 **NEW COLLEGE NOTICE**\n"
                  f"📅 **{date_text}**\n"
                  f"📄 {title}",
              "allowed_mentions": {
                  "parse": ["everyone"]
              }
          }

          print("Sending PDF to Discord...")

          with open(filename, "rb") as f:

              discord_response = requests.post(

                  WEBHOOK,

                  data={
                      "payload_json":
                      json.dumps(message)
                  },

                  files={
                      "files[0]": (
                          filename,
                          f,
                          "application/pdf"
                      )
                  },

                  timeout=120
              )

          discord_response.raise_for_status()

          print("SUCCESS! PDF sent to Discord.")

          # -----------------------------
          # SAVE NEWEST NOTICE
          # -----------------------------

          with open(STATE, "w") as f:
              f.write(pdf_url)

          print("Notice state updated.")

          PY

      - name: Save notice state
        run: |
          git config user.name "College Notice Bot"
          git config user.email "actions@github.com"

          git add last_notice.txt

          git diff --cached --quiet || \
            git commit -m "Update latest college notice"

          git push
