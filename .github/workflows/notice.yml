name: College Notice to Discord

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-notice:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          pip install requests beautifulsoup4

      - name: Check for new college notice
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import time
          import glob
          import subprocess
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          PAGE = "https://www.suryasencollege.org.in/new_2020_GeneralNotice.php"
          STATE = "last_notice.txt"
          WEBHOOK = os.environ["DISCORD_WEBHOOK"]

          # Get website
          html = None

          for attempt in range(1, 6):
              try:
                  print("Website attempt", attempt, "of 5")

                  r = requests.get(
                      PAGE,
                      headers={"User-Agent": "Mozilla/5.0"},
                      timeout=60
                  )

                  r.raise_for_status()
                  html = r.text

                  print("Website connected successfully.")
                  break

              except Exception as e:
                  print("Website error:", e)

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if html is None:
              print("Could not connect to college website.")
              raise SystemExit(1)

          # Find PDF notices
          soup = BeautifulSoup(html, "html.parser")
          notices = []

          for a in soup.find_all("a", href=True):

              text = a.get_text(" ", strip=True)
              href = a.get("href", "").strip()

              if ".pdf" not in href.lower():
                  continue

              match = re.search(
                  r"(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})",
                  text
              )

              if not match:
                  continue

              pdf_url = urljoin(PAGE, href)
              date_text = match.group(0)

              notices.append(
                  (date_text, text, pdf_url)
              )

          if not notices:
              print("No PDF notices found.")
              raise SystemExit(1)

          # Website lists newest notice first
          date_text, title, pdf_url = notices[0]

          print("Latest notice date:", date_text)
          print("Latest notice title:", title)
          print("Latest PDF:", pdf_url)

          # Check state
          old = ""

          if os.path.exists(STATE):
              with open(STATE, "r") as f:
                  old = f.read().strip()

          if old == pdf_url:
              print("No new notice.")
              raise SystemExit(0)

          print("New notice detected.")

          # Download PDF
          pdf_data = None

          for attempt in range(1, 6):
              try:
                  print("PDF download attempt", attempt, "of 5")

                  r = requests.get(
                      pdf_url,
                      headers={"User-Agent": "Mozilla/5.0"},
                      timeout=90
                  )

                  r.raise_for_status()
                  pdf_data = r.content

                  print("PDF downloaded successfully.")
                  break

              except Exception as e:
                  print("PDF download error:", e)

                  if attempt < 5:
                      time.sleep(attempt * 10)

          if pdf_data is None:
              print("Could not download PDF.")
              raise SystemExit(1)

          filename = pdf_url.split("/")[-1].split("?")[0]

          if not filename.lower().endswith(".pdf"):
              filename = "college_notice.pdf"

          with open(filename, "wb") as f:
              f.write(pdf_data)

          print("PDF saved:", filename)

          # OCR
          notice_number = "Not detected"

          try:
              print("Starting OCR.")

              subprocess.run(
                  [
                      "pdftoppm",
                      "-f", "1",
                      "-l", "5",
                      "-r", "300",
                      "-png",
                      filename,
                      "notice_page"
                  ],
                  check=True
              )

              images = sorted(
                  glob.glob("notice_page-*.png")
              )

              print("Pages converted:", len(images))

              ocr_text = ""

              for image in images:

                  print("OCR:", image)

                  result = subprocess.run(
                      [
                          "tesseract",
                          image,
                          "stdout",
                          "--psm",
                          "6"
                      ],
                      capture_output=True,
                      text=True
                  )

                  page_text = result.stdout
                  ocr_text += "\n" + page_text

              # Search for Notice No.
              patterns = [
                  r"Notice\s*No\.?\s*[:\-]?\s*(\d{1,4})",
                  r"Notice\s*Number\s*[:\-]?\s*(\d{1,4})",
                  r"NOTICE\s*NO\.?\s*[:\-]?\s*(\d{1,4})",
                  r"NO\.?\s*[:\-]\s*(\d{1,4})"
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      ocr_text,
                      re.IGNORECASE
                  )

                  if match:
                      notice_number = match.group(1)
                      break

              print("Detected Notice Number:", notice_number)

              # Remove temporary images
              for image in images:
                  try:
                      os.remove(image)
                  except Exception:
                      pass

          except Exception as e:
              print("OCR failed:", e)
              print("Continuing without notice number.")

          # Discord message
          message = {
              "content": (
                  "@everyone\n"
                  "📢 **NEW COLLEGE NOTICE**\n"
                  f"🔢 **Notice No.: {notice_number}**\n"
                  f"📅 **Date: {date_text}**\n"
                  f"📄 **{title}**"
              ),
              "allowed_mentions": {
                  "parse": ["everyone"]
              }
          }

          print("Sending notice to Discord.")

          with open(filename, "rb") as f:

              discord_response = requests.post(
                  WEBHOOK,
                  data={
                      "payload_json": json.dumps(message)
                  },
                  files={
                      "files[0]": (
                          filename,
                          f,
                          "application/pdf"
                      )
                  },
                  timeout=120
              )

          discord_response.raise_for_status()

          print("PDF successfully sent to Discord.")

          # Save state
          with open(STATE, "w") as f:
              f.write(pdf_url)

          print("Notice state updated.")

          PY

      - name: Save notice state
        run: |
          git config user.name "College Notice Bot"
          git config user.email "actions@github.com"

          git add last_notice.txt

          git diff --cached --quiet || git commit -m "Update latest college notice"

          git push
